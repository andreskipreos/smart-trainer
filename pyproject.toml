[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-trainer"
version = "0.1.0"
description = "Trainer de rodillo para la terminal: controla rodillos FTMS (Tacx Neo 2T, etc.) y corre entrenamientos estructurados."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.22",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
trainer = "smart_trainer.cli:main"

[tool.setuptools]
packages = ["smart_trainer"]

[tool.setuptools.package-data]
smart_trainer = ["workouts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
